<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
        <meta content="SkillForge personalized learning and skill development ecosystem." name="description"/>
        <title>
            Course Assessment | SkillForge
        </title>
        <link href="assets/skillforge-logo.svg" rel="icon" type="image/svg+xml"/>
        <link href="css/style.css" rel="stylesheet"/>
        <script src="js/data.js">
        </script>
        <script src="js/api.js">
        </script>
        <script src="js/common.js">
        </script>
    </head>
    <body class="app-page" data-page="learning" data-protected="true" data-title="Course Assessment">
        <aside class="sidebar" id="appSidebar">
        </aside>
        <main class="app-main">
            <header class="app-topbar" id="appTopbar">
            </header>
            <div class="app-content">
                <div class="quiz-wrap">
                    <div class="quiz-head">
                        <div>
                            <span class="eyebrow">
                                Final knowledge check
                            </span>
                            <h1 id="quizTitle">
                                Course Assessment
                            </h1>
                        </div>
                        <span class="pill">
                            10 MCQs · easy → hard
                        </span>
                    </div>
                    <form id="quizForm">
                    </form>
                    <div class="hidden" id="quizResult">
                    </div>
                </div>
            </div>
        </main>
        <script src="js/quiz.js">
        </script>
    </body>
</html>
