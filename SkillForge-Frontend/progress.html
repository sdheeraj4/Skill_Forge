<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
        <meta content="SkillForge personalized learning and skill development ecosystem." name="description"/>
        <title>
            Progress | SkillForge
        </title>
        <link href="assets/skillforge-logo.svg" rel="icon" type="image/svg+xml"/>
        <link href="css/style.css" rel="stylesheet"/>
        <script src="js/data.js">
        </script>
        <script src="js/api.js">
        </script>
        <script src="js/common.js">
        </script>
    </head>
    <body class="app-page" data-page="progress" data-protected="true" data-title="Progress">
        <aside class="sidebar" id="appSidebar">
        </aside>
        <main class="app-main">
            <header class="app-topbar" id="appTopbar">
            </header>
            <div class="app-content">
                <div class="welcome-row">
                    <div>
                        <span class="eyebrow">
                            Learning analytics
                        </span>
                        <h1>
                            See the work behind your growth.
                        </h1>
                        <p>
                            Progress combines course completion, quiz performance and recent learning activity.
                        </p>
                    </div>
                </div>
                <div class="stats-grid" id="progressStats">
                </div>
                <div class="dashboard-grid">
                    <section class="panel">
                        <div class="panel-head">
                            <h2>
                                Course progress
                            </h2>
                        </div>
                        <div id="courseProgressList">
                        </div>
                    </section>
                    <section class="panel">
                        <div class="panel-head">
                            <h2>
                                Learning activity
                            </h2>
                        </div>
                        <div class="activity-list" id="activityList">
                        </div>
                    </section>
                </div>
                <section class="panel report-card-panel" id="reportCardSection" style="margin-top:18px">
                    <div class="panel-head">
                        <div>
                            <span class="eyebrow">
                                Candidate performance
                            </span>
                            <h2 style="margin-top:5px">
                                SkillForge report card
                            </h2>
                        </div>
                        <button class="btn btn-secondary btn-sm" id="printReport" type="button">
                            Print report
                        </button>
                    </div>
                    <div class="report-candidate" id="reportCandidate">
                    </div>
                    <div class="report-meta" id="reportMeta">
                    </div>
                    <div class="report-table-wrap">
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>
                                        Course
                                    </th>
                                    <th>
                                        Modules
                                    </th>
                                    <th>
                                        Best score
                                    </th>
                                    <th>
                                        Performance
                                    </th>
                                    <th>
                                        Status
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="reportCourseRows">
                            </tbody>
                        </table>
                    </div>
                    <div class="report-insights" id="reportInsights">
                    </div>
                    <div class="muted" id="reportGenerated" style="margin-top:16px;font-size:.82rem">
                    </div>
                </section>
            </div>
        </main>
        <script src="js/progress.js">
        </script>
    </body>
</html>
